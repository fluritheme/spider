<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Spider browser fixture</title
  ><style>
    body {
      margin: 0;
      background: #f5f2eb;
      min-height: 1800px;
      font: 16px system-ui;
    }
    #root {
      position: relative;
      margin: 70px 24px 0;
      width: min(600px, calc(100vw - 48px));
      height: 420px;
      isolation: isolate;
    }
    #target {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 310px;
      background: #ddd4c6;
      border-radius: 16px;
    }
    #cover {
      position: absolute;
      left: 0;
      top: 0;
      width: 90px;
      height: 230px;
      z-index: 20;
      background: #aa0000;
      display: none;
    }
    #button {
      position: absolute;
      left: 130px;
      top: 160px;
    }
    #root.clipped {
      height: 140px;
      overflow: hidden;
    }
    #added {
      width: 180px;
      height: 150px;
      background: #fff;
      position: absolute;
      left: 190px;
      top: 230px;
    }
    #nested {
      isolation: isolate;
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
  </style>
  <div id="root">
    <article id="target" data-spider-web="top-left">
      <button id="button">Clickable content</button>
    </article>
    <div id="cover"></div>
  </div>
  <script type="module">
    import { createSpider } from '../src/index.ts';
    import { measureNetwork } from '../src/silk.ts';
    window.measureNetwork = measureNetwork;
    window.createSpider = createSpider;
    window.spider = createSpider({
      root: document.querySelector('#root'),
      weave: false,
      roam: false,
    });
    document.querySelector('#button').onclick = () => {
      document.querySelector('#button').textContent = 'Clicked';
    };
  </script>
</html>
