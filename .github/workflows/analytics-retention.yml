name: Analytics retention
on:
  schedule:
    - cron: '29 3 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove expired aggregates and sessions
        env:
          MAINTENANCE_KEY: ${{ secrets.SPIDER_MAINTENANCE_KEY }}
        run: |
          test -n "$MAINTENANCE_KEY"
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 \
            --request POST --header "Authorization: Bearer $MAINTENANCE_KEY" \
            https://spider.fluri.xyz/api/maintenance/cleanup
